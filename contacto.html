<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contáctanos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <h1>Contáctanos</h1>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="dirigido.html">¿A quién va dirigido?</a>
        <a href="alcance.html">Alcance del sistema</a>
        <a href="contacto.html">Contáctanos</a>
    </nav>
</header>

<style>
    body {
        background: linear-gradient(135deg, #a8c0ff, #fbc2eb); /* pastel suave */
        font-family: 'Segoe UI', sans-serif;
    }

    .form-container {
        max-width: 460px;
        margin: 50px auto;
        padding: 30px;
        border-radius: 20px;
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.35);
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        border: 1px solid rgba(255, 255, 255, 0.5);
        animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(15px);}
        to {opacity: 1; transform: translateY(0);}
    }

    .form-container h2 {
        text-align: center;
        font-size: 26px;
        margin-bottom: 20px;
        color: #444;
        font-weight: 700;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        font-size: 14px;
        color: #555;
        font-weight: 600;
        display: block;
        margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.7);
        background: rgba(255,255,255,0.6);
        color: #333;
        font-size: 15px;
        outline: none;
        transition: 0.25s ease;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
        color: #888;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #7da8ff;
        background: rgba(255,255,255,0.85);
        box-shadow: 0 0 10px rgba(125,168,255,0.5);
    }

    .form-group textarea {
        resize: none;
        height: 110px;
    }

    .form-container button {
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: none;
        background: #7da8ff;     /* pastel celeste */
        color: white;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 8px 20px rgba(125,168,255,0.35);
    }

    .form-container button:hover {
        background: #5d8ef7;
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(125,168,255,0.5);
    }
</style>

<div class="form-container">
    <h2>Formulario</h2>

    <form action="/enviar" method="POST">
        
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="nombre" placeholder="Tu nombre..." required>
        </div>

        <div class="form-group">
            <label>Correo</label>
            <input type="email" name="correo" placeholder="email@example.com" required>
        </div>

        <div class="form-group">
            <label>Teléfono (opcional)</label>
            <input type="text" name="telefono" placeholder="0000-0000">
        </div>

        <div class="form-group">
            <label>Asunto</label>
            <input type="text" name="asunto" placeholder="Motivo del mensaje..." required>
        </div>

        <div class="form-group">
            <label>Sugerencia</label>
            <textarea name="sugerencia" placeholder="Escribe tu sugerencia aquí..." required></textarea>
        </div>

        <button type="submit">Enviar mensaje</button>
    </form>
</div>
